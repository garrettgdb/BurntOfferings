<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex"><title>Studio — Burnt Offerings Art</title>
<style>
:root{--ink:#291f30;--paper:#efe9d7;--red:#873b42;--rule:#c4bba5}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:20px}h1{font:500 30px Georgia,serif;margin:0}h2{font:500 22px Georgia,serif;margin:0 0 12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
button,.btn{font:inherit;padding:8px 14px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;border-radius:4px;text-decoration:none;display:inline-block}
button:disabled{opacity:.35;cursor:default}button.primary{background:var(--ink);color:var(--paper)}button.danger{color:var(--red);border-color:var(--red)}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs .on{background:var(--ink);color:var(--paper)}
input,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--rule);background:#fff;border-radius:4px}
input[type=checkbox],input[type=color],input[type=range]{width:auto;padding:0}input[type=color]{width:64px;height:36px}input[type=range]{width:100%}
label{display:block;margin:0 0 12px;font-weight:600}label input,label textarea{font-weight:400;margin-top:4px}
.chk{font-weight:400;display:flex;align-items:center;gap:8px}fieldset{border:1px solid var(--rule);margin:0 0 12px;padding:8px 12px}
.card{background:#fff8;border:1px solid var(--rule);padding:18px;border-radius:6px;max-width:520px}.card.wide{max-width:none}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--rule)}.row img{width:64px;height:64px;object-fit:cover;background:#4a3a48;border-radius:4px}
.grow{flex:1;min-width:0}.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.acts button{padding:6px 10px}
.thumb{width:120px;height:120px;object-fit:cover;display:block;margin:6px 0;border-radius:4px}
.note{padding:10px 12px;background:#d5db8d;border-radius:4px}.note.err{background:#eed0cc;color:#5b1f1f}
.prev{padding:0;border:1px solid var(--rule);margin:0 0 14px}.prev div{padding:14px 12px;font:500 24px Georgia,serif}.prev p{margin:0;padding:12px}
.crow{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px}.crow label{margin:0}
small{color:#6b6270}
</style>
</head>
<body><main id="app"></main>
<script src="../config.js"></script>
<script src="studio.js"></script>
</body></html>

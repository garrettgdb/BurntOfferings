name: Sync content from Supabase
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-from-supabase.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Commit changes
        run: |
          git config user.name "content-sync"
          git config user.email "content-sync@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Sync content from Supabase" && git push)
